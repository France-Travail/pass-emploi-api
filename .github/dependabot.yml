version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'chore(deps):'
    # Laisse à la communauté le temps de repérer une version compromise, plus longtemps pour une majeure.
    # Ne s'applique pas aux security updates.
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      # La majeure de @types/node suit celle de Node en prod, montée à la main avec le runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      nestjs:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - '@nestjs/*'
      nestjs-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - '@nestjs/*'
      aws-sdk:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - '@aws-sdk/*'
      aws-sdk-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - '@aws-sdk/*'
      eslint:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
      eslint-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
      sequelize:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - 'sequelize'
          - 'sequelize-cli'
          - 'sequelize-typescript'
      sequelize-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - 'sequelize'
          - 'sequelize-cli'
          - 'sequelize-typescript'
      testing:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - 'mocha'
          - 'chai'
          - 'chai-*'
          - 'dirty-chai'
          - 'sinon'
          - 'sinon-chai'
          - '@salesforce/ts-sinon'
          - 'supertest'
          - 'nyc'
          - '@types/mocha'
          - '@types/chai*'
          - '@types/dirty-chai'
          - '@types/sinon*'
          - '@types/supertest'
      testing-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - 'mocha'
          - 'chai'
          - 'chai-*'
          - 'dirty-chai'
          - 'sinon'
          - 'sinon-chai'
          - '@salesforce/ts-sinon'
          - 'supertest'
          - 'nyc'
          - '@types/mocha'
          - '@types/chai*'
          - '@types/dirty-chai'
          - '@types/sinon*'
          - '@types/supertest'
      elastic-apm:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - '@elastic/*'
          - 'elastic-apm-*'
      elastic-apm-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - '@elastic/*'
          - 'elastic-apm-*'
      # Dependabot range une dépendance dans le groupe le plus « spécifique », pas dans le premier déclaré :
      # sans ces exclusions, un groupe sans `patterns` l'emporte sur un motif à joker comme `@nestjs/*`.
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
          - minor
        exclude-patterns:
          - '@nestjs/*'
          - '@aws-sdk/*'
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
          - 'sequelize'
          - 'sequelize-cli'
          - 'sequelize-typescript'
          - 'mocha'
          - 'chai'
          - 'chai-*'
          - 'dirty-chai'
          - 'sinon'
          - 'sinon-chai'
          - '@salesforce/ts-sinon'
          - 'supertest'
          - 'nyc'
          - '@types/mocha'
          - '@types/chai*'
          - '@types/dirty-chai'
          - '@types/sinon*'
          - '@types/supertest'
          - '@elastic/*'
          - 'elastic-apm-*'
      prod-major:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - major
        exclude-patterns:
          - '@nestjs/*'
          - '@aws-sdk/*'
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
          - 'sequelize'
          - 'sequelize-cli'
          - 'sequelize-typescript'
          - 'mocha'
          - 'chai'
          - 'chai-*'
          - 'dirty-chai'
          - 'sinon'
          - 'sinon-chai'
          - '@salesforce/ts-sinon'
          - 'supertest'
          - 'nyc'
          - '@types/mocha'
          - '@types/chai*'
          - '@types/dirty-chai'
          - '@types/sinon*'
          - '@types/supertest'
          - '@elastic/*'
          - 'elastic-apm-*'
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
          - minor
        exclude-patterns:
          - '@nestjs/*'
          - '@aws-sdk/*'
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
          - 'sequelize'
          - 'sequelize-cli'
          - 'sequelize-typescript'
          - 'mocha'
          - 'chai'
          - 'chai-*'
          - 'dirty-chai'
          - 'sinon'
          - 'sinon-chai'
          - '@salesforce/ts-sinon'
          - 'supertest'
          - 'nyc'
          - '@types/mocha'
          - '@types/chai*'
          - '@types/dirty-chai'
          - '@types/sinon*'
          - '@types/supertest'
          - '@elastic/*'
          - 'elastic-apm-*'
      dev-major:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - major
        exclude-patterns:
          - '@nestjs/*'
          - '@aws-sdk/*'
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
          - 'sequelize'
          - 'sequelize-cli'
          - 'sequelize-typescript'
          - 'mocha'
          - 'chai'
          - 'chai-*'
          - 'dirty-chai'
          - 'sinon'
          - 'sinon-chai'
          - '@salesforce/ts-sinon'
          - 'supertest'
          - 'nyc'
          - '@types/mocha'
          - '@types/chai*'
          - '@types/dirty-chai'
          - '@types/sinon*'
          - '@types/supertest'
          - '@elastic/*'
          - 'elastic-apm-*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(docker):'
    # Images qui doublent les addons Scalingo : leur version suit celle de la prod, pas la dernière publiée
    ignore:
      - dependency-name: 'postgis/postgis'
      - dependency-name: 'redis'
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
