version: 2

updates:
  # ===========================================
  # NPM Dependencies
  # ===========================================
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps):'
    # Laisse à la communauté le temps de repérer une version compromise avant qu'on l'installe,
    # et aux majeures le temps de leurs premiers correctifs. Ne s'applique pas aux security updates.
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      # Une seule PR par jour, auto-mergée côté CI : pas de PR auto-mergée qui attend un rebase derrière une autre
      minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  # ===========================================
  # GitHub Actions
  # ===========================================
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    cooldown:
      default-days: 3
    groups:
      # GitHub Actions - patch and minor (auto-merge côté CI)
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      # Majors : pas de groupe, chaque action a sa propre PR
