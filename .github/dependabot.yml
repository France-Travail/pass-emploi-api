version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps):'
    # Majeures npm montées hors Dependabot : elles demandent souvent une refacto.
    # Sans effet sur les security updates, créées quel que soit le type de montée.
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    # Laisse à la communauté le temps de repérer une version compromise. Ne s'applique pas aux security updates.
    cooldown:
      default-days: 3
    groups:
      nestjs:
        applies-to: version-updates
        patterns:
          - '@nestjs/*'
      aws-sdk:
        applies-to: version-updates
        patterns:
          - '@aws-sdk/*'
      eslint:
        applies-to: version-updates
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
      sequelize:
        applies-to: version-updates
        patterns:
          - 'sequelize'
          - 'sequelize-cli'
          - 'sequelize-typescript'
      testing:
        applies-to: version-updates
        patterns:
          - 'mocha'
          - 'chai'
          - 'chai-*'
          - 'dirty-chai'
          - 'sinon'
          - 'sinon-chai'
          - '@salesforce/ts-sinon'
          - 'supertest'
          - 'nyc'
          - '@types/mocha'
          - '@types/chai*'
          - '@types/dirty-chai'
          - '@types/sinon*'
          - '@types/supertest'
      elastic-apm:
        applies-to: version-updates
        patterns:
          - '@elastic/*'
          - 'elastic-apm-*'
      # Dependabot range une dépendance dans le groupe le plus « spécifique », pas dans le premier déclaré :
      # sans ces exclusions, un groupe sans `patterns` l'emporte sur un motif à joker comme `@nestjs/*`.
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
          - minor
        exclude-patterns:
          - '@nestjs/*'
          - '@aws-sdk/*'
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
          - 'sequelize'
          - 'sequelize-cli'
          - 'sequelize-typescript'
          - 'mocha'
          - 'chai'
          - 'chai-*'
          - 'dirty-chai'
          - 'sinon'
          - 'sinon-chai'
          - '@salesforce/ts-sinon'
          - 'supertest'
          - 'nyc'
          - '@types/mocha'
          - '@types/chai*'
          - '@types/dirty-chai'
          - '@types/sinon*'
          - '@types/supertest'
          - '@elastic/*'
          - 'elastic-apm-*'
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
          - minor
        exclude-patterns:
          - '@nestjs/*'
          - '@aws-sdk/*'
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - '@eslint/*'
          - 'sequelize'
          - 'sequelize-cli'
          - 'sequelize-typescript'
          - 'mocha'
          - 'chai'
          - 'chai-*'
          - 'dirty-chai'
          - 'sinon'
          - 'sinon-chai'
          - '@salesforce/ts-sinon'
          - 'supertest'
          - 'nyc'
          - '@types/mocha'
          - '@types/chai*'
          - '@types/dirty-chai'
          - '@types/sinon*'
          - '@types/supertest'
          - '@elastic/*'
          - 'elastic-apm-*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(docker):'
    # Images qui doublent les addons Scalingo : leur version suit la prod via l'inventaire du lot 3
    ignore:
      - dependency-name: 'postgis/postgis'
      - dependency-name: 'redis'
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
