version: 2

updates:
  # ===========================================
  # NPM Dependencies
  # ===========================================
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps):'
    # Laisse à la communauté le temps de repérer une version compromise avant qu'on l'installe.
    # Ne s'applique pas aux security updates.
    cooldown:
      default-days: 3
    # Les majeures sont des migrations : elles sont traitées une fois par sprint avec le skill
    # upgrade-dependency, pas par PR Dependabot. Cet ignore s'applique aussi aux security updates :
    # une CVE dont le correctif impose une majeure passe par fix-cve.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      # Une seule PR par jour, auto-mergée côté CI : pas de PR auto-mergée qui attend un rebase derrière une autre
      minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  # ===========================================
  # GitHub Actions
  # ===========================================
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    cooldown:
      default-days: 3
    groups:
      # GitHub Actions - patch and minor (auto-merge côté CI)
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      # Majors : pas de groupe, chaque action a sa propre PR
