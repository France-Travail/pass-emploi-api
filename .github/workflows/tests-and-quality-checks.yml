name: Tests and Quality Checks

on:
  push:
    branches: [develop, master]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - uses: France-Travail/pass-emploi-tools/.github/actions/lint-and-typecheck@645baca94d9825a7502bc1b143097cc8a9c6b707

  test:
    name: Tests
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    services:
      postgres:
        image: postgis/postgis:14-3.2-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:8-alpine
        ports:
          - 6767:6379

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6767

    steps:
      - uses: France-Travail/pass-emploi-tools/.github/actions/test-and-upload@645baca94d9825a7502bc1b143097cc8a9c6b707
        with:
          test-command: 'yarn test:ci'

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    # 49699333 = Dependabot bot user ID
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.user.id != 49699333

    steps:
      - uses: France-Travail/pass-emploi-tools/.github/actions/sonarqube-scan@645baca94d9825a7502bc1b143097cc8a9c6b707
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
